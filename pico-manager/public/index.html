<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#16213e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PICO Manager">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <title>PICO 4 VR Manager</title>
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="header-right">
      <h1 class="logo">PICO 4 Manager</h1>
      <span class="device-count" id="deviceCount">0/5 מחוברים</span>
      <span class="ws-status disconnected" title="חיבור לשרת"></span>
    </div>
    <div class="header-left">
      <button class="btn btn-primary" id="btnScan" title="סרוק מכשירים ברשת">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 4v6h6"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
        סריקה
      </button>
      <button class="btn btn-secondary" id="btnStreamAll" title="הפעל שיקוף מכל המכשירים">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
        שיקוף הכל
      </button>
    </div>
  </header>

  <!-- Bulk Controls -->
  <div class="bulk-controls" id="bulkControls">
    <div class="bulk-section">
      <label>שליטה על כל המכשירים:</label>
      <div class="bulk-actions">
        <div class="input-group">
          <input type="text" id="bulkAppPackage" placeholder="שם חבילת אפליקציה" class="input-text">
          <button class="btn btn-sm btn-success" id="btnBulkLaunch">הפעל בכולם</button>
          <button class="btn btn-sm btn-danger" id="btnBulkStop">עצור בכולם</button>
        </div>
        <div class="input-group">
          <label>ווליום:</label>
          <input type="range" id="bulkVolume" min="0" max="15" value="8" class="slider">
          <span id="bulkVolumeVal">8</span>
          <button class="btn btn-sm" id="btnBulkVolume">החל</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Screen Grid -->
  <div class="screen-grid" id="screenGrid">
    <!-- Device cards will be dynamically inserted here -->
    <div class="empty-state" id="emptyState">
      <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#555" stroke-width="1.5"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
      <h2>אין מכשירים מחוברים</h2>
      <p>לחץ על "סריקה" כדי לחפש משקפי PICO 4 ברשת המקומית</p>
      <p class="hint">ודא שהמשקפיים מחוברים לאותה רשת WiFi וש-ADB מופעל</p>
    </div>
  </div>

  <!-- Add Device Modal -->
  <div class="modal" id="addDeviceModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>הוסף מכשיר ידנית</h2>
        <button class="btn-close" id="btnCloseModal">&times;</button>
      </div>
      <div class="modal-body">
        <label>כתובת IP של המכשיר:</label>
        <input type="text" id="manualIp" placeholder="192.168.1.100" class="input-text input-large">
        <button class="btn btn-primary" id="btnManualConnect">התחבר</button>
      </div>
    </div>
  </div>

  <!-- App List Modal -->
  <div class="modal" id="appListModal">
    <div class="modal-content modal-large">
      <div class="modal-header">
        <h2>אפליקציות מותקנות - <span id="appListDevice"></span></h2>
        <button class="btn-close" id="btnCloseAppModal">&times;</button>
      </div>
      <div class="modal-body">
        <div class="app-list" id="appList">
          <p>טוען...</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Floating Add Button -->
  <button class="fab" id="btnAddDevice" title="הוסף מכשיר ידנית">+</button>

  <!-- Toast Notification -->
  <div class="toast-container" id="toastContainer"></div>

  <script src="js/h264-player.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js');
    }
  </script>
</body>
</html>
